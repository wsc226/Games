/* top strip: next station */
#top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:20;

#t-install{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);

#deck{position:absolute;left:0;right:0;bottom:0;z-index:25;padding:12px 14px calc(14px + env(safe-area-inset-bottom));

#subtitle .en{display:block;font-size:13px;color:#cde;margin-top:2px}

@keyframes cd{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
#result{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
