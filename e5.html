<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Shinkansen Adventure</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100dvh;overflow:hidden;background:#07131f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:relative;width:100%;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%}
#bar{position:absolute;z-index:6;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 8px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.circle{pointer-events:auto;width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(6,20,35,.78);color:#fff;font-size:23px;font-weight:900;box-shadow:0 5px 14px rgba(0,0,0,.3)}
.trip{display:flex;gap:13px;align-items:center;padding:9px 15px;border-radius:24px;border:2px solid rgba(255,255,255,.3);background:rgba(6,20,35,.78);color:white;font-weight:900}.trip span{white-space:nowrap}
#routeProgress{position:absolute;z-index:5;top:calc(env(safe-area-inset-top,0px) + 72px);left:18%;right:18%;height:15px;border:2px solid rgba(255,255,255,.5);border-radius:10px;background:rgba(0,0,0,.38);overflow:hidden}#routeFill{height:100%;width:0;background:linear-gradient(90deg,#32ddb4,#ffd23f);border-radius:8px;transition:width .2s}
#controls{position:absolute;z-index:7;left:0;right:0;bottom:0;padding:18px 22px calc(env(safe-area-inset-bottom,0px) + 16px);display:grid;grid-template-columns:1fr 1fr;gap:18px;background:linear-gradient(transparent,rgba(2,12,22,.94) 35%)}.move{height:92px;border:3px solid white;border-radius:24px;color:#fff;font-size:39px;font-weight:1000;box-shadow:0 7px 0 #102d50}.move.up{background:linear-gradient(#4ec9ff,#1e77d8)}.move.down{background:linear-gradient(#67e7a0,#1ba65e)}.move:active{transform:translateY(5px);box-shadow:0 2px 0 #102d50}
.screen{position:absolute;z-index:30;inset:0;padding:calc(env(safe-area-inset-top,0px) + 22px) 22px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:auto;background:radial-gradient(circle at 50% 15%,#19457b,#081522 65%);color:#fff;transition:opacity .25s}.screen.hidden{opacity:0;pointer-events:none}
.trainLogo{font-size:72px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4));animation:drift 2.8s ease-in-out infinite}@keyframes drift{50%{transform:translateX(12px)}}h1{font-size:clamp(38px,7vw,64px);line-height:1;color:#7ff1c8;text-shadow:0 4px 0 #12644c;letter-spacing:1px}.subtitle{margin:10px 0 16px;color:#d8ebff;font-size:19px;font-weight:700}
.label{margin:9px 0 8px;color:#ffd95d;font-size:14px;font-weight:950;letter-spacing:2px}.choiceRow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.trainChoice,.routeChoice{border:3px solid rgba(255,255,255,.27);background:rgba(255,255,255,.09);color:#fff;border-radius:18px;font-weight:900}.trainChoice{width:112px;height:76px;padding:6px;font-size:14px}.miniTrain{display:block;font-size:34px}.routeChoice{min-width:100px;height:54px;padding:7px 13px;font-size:15px}.trainChoice.on,.routeChoice.on{border-color:#ffe36c;background:rgba(255,227,108,.2);box-shadow:0 5px 0 #8c5c13;transform:translateY(-3px)}
.play{margin-top:21px;min-width:235px;min-height:70px;border:3px solid #fff;border-radius:20px;background:linear-gradient(#73ec94,#2bc562);color:#06341a;font-size:27px;font-weight:1000;letter-spacing:2px;box-shadow:0 7px 0 #167037}.play:active{transform:translateY(5px);box-shadow:0 2px 0 #167037}.homeText{margin-top:15px;min-width:165px;min-height:48px;border:2px solid rgba(255,255,255,.45);border-radius:15px;background:rgba(255,255,255,.08);color:#fff;font-size:17px;font-weight:900}
#callout{position:absolute;z-index:12;top:21%;left:50%;transform:translateX(-50%) scale(0);padding:12px 22px;border:3px solid white;border-radius:23px;background:#ffd64f;color:#4c3200;font-size:27px;font-weight:1000;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}#callout.show{opacity:1;transform:translateX(-50%) scale(1)}
#tutorial{position:absolute;z-index:14;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(4,17,30,.7);color:#fff;font-weight:1000;font-size:28px;text-align:center;pointer-events:none}#tutorial.show{display:flex}.tArrows{font-size:78px;letter-spacing:20px;animation:pulse .75s ease-in-out infinite alternate}@keyframes pulse{to{transform:scale(1.13)}}
.stamp{font-size:82px}.result{margin:14px 0 6px;font-size:23px;font-weight:850}.passport{margin:4px 0 12px;color:#ffe36c;font-size:17px;font-weight:900}
@media (orientation:landscape){#controls{left:auto;width:300px;top:22%;bottom:12%;padding:10px 16px;background:none;grid-template-columns:1fr;grid-template-rows:1fr 1fr}.move{height:auto}.screen{padding-top:10px}.trainLogo{font-size:52px}h1{font-size:40px}.subtitle{margin:5px 0 8px}.label{margin:5px}.play{margin-top:13px;min-height:56px}.routeProgress{left:30%;right:30%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app">
  <canvas id="canvas" aria-label="Three-track Shinkansen journey"></canvas>
  <div id="bar"><button class="circle" id="home" aria-label="Home">⌂</button><div class="trip"><span>🎫 <b id="tickets">0</b></span><span>⭐ <b id="stars">0</b></span></div><button class="circle" id="sound" aria-label="Sound on">🔊</button></div>
  <div id="routeProgress"><div id="routeFill"></div></div>
  <div id="controls"><button class="move up" id="up" aria-label="Move to the track above">▲</button><button class="move down" id="down" aria-label="Move to the track below">▼</button></div>
  <div id="callout">GREAT!</div><div id="tutorial"><div class="tArrows">▲ ▼</div><div>Tap to change tracks!</div></div>
  <section class="screen" id="start">
    <div class="trainLogo">🚄</div><h1>SHINKANSEN ADVENTURE</h1><p class="subtitle">Pick a train and take it to the station!</p>
    <div class="label">CHOOSE A TRAIN</div><div class="choiceRow"><button class="trainChoice on" data-train="E5"><span class="miniTrain">🚄</span>HAYABUSA</button><button class="trainChoice" data-train="E6"><span class="miniTrain">🚅</span>KOMACHI</button><button class="trainChoice" data-train="DY"><span class="miniTrain">🚆</span>DR. YELLOW</button></div>
    <div class="label">CHOOSE A TRIP</div><div class="choiceRow"><button class="routeChoice on" data-route="city">🏙️ CITY</button><button class="routeChoice" data-route="snow">❄️ SNOW</button><button class="routeChoice" data-route="sunset">🌅 SUNSET</button></div>
    <button class="play" id="play">START TRIP</button><button class="homeText" id="startHome">⌂ HOME</button>
  </section>
  <section class="screen hidden" id="finish"><div class="stamp">🏁</div><h1>STATION ARRIVAL!</h1><div class="result">You collected <span id="resultStars">0</span> stars.</div><div class="passport">PASSPORT STAMPS: <span id="stampCount">1</span></div><button class="play" id="again">NEXT TRIP</button><button class="homeText" id="finishHome">⌂ HOME</button></section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1,last=0,raf=0,active=false,paused=false,elapsed=0,lane=1,stars=0,tickets=0,spawnClock=3,objects=[],scenery=[],train='E5',route='city',bounce=0,muted=localStorage.getItem('trainAdventureMuted')==='1',audio=null;
const TRIP_TIME=48,TRAIN_COLORS={E5:['#edf7f5','#14a88f','#ed2580'],E6:['#f7f7f7','#cf342b','#444'],DY:['#f4d21e','#2b69aa','#555']},ROUTES={city:{sky:['#111b3b','#5d78a9'],ground:'#253547',icon:'🏙️'},snow:{sky:['#7fb9d9','#eaf8ff'],ground:'#d9edf3',icon:'🏔️'},sunset:{sky:['#6b3d78','#ffae62'],ground:'#5e5742',icon:'🌅'}};
function ac(){if(muted)return null;if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function tone(f,d=.12,type='sine',v=.1,del=0){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),n=a.currentTime+del;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+d+.02)}
const sfx={move:()=>tone(410,.1,'sine',.09),star:()=>{tone(720,.12,'sine',.1);tone(1060,.18,'sine',.09,.09)},ticket:()=>[520,780,1040].forEach((f,i)=>tone(f,.18,'sine',.1,i*.08)),bump:()=>tone(160,.25,'triangle',.12),depart:()=>[392,523,659].forEach((f,i)=>tone(f,.22,'sine',.1,i*.13)),arrive:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.35,'sine',.12,i*.14))};
function updateSound(){$('sound').textContent=muted?'🔇':'🔊'}function trackY(n){return H*(.33+n*.22)}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);makeScenery()}
function makeScenery(){scenery=Array.from({length:15},(_,i)=>({x:i*110,y:75+(i%3)*45,s:22+(i%4)*4}))}
function bg(dt){const r=ROUTES[route],g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,r.sky[0]);g.addColorStop(.55,r.sky[1]);g.addColorStop(1,r.ground);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.font='42px sans-serif';ctx.globalAlpha=.75;scenery.forEach((s,i)=>{s.x-=dt*(22+i%3*6);if(s.x<-70)s.x=W+Math.random()*120;ctx.fillText(i%4===0?r.icon:(route==='snow'?'🌲':'🌳'),s.x,s.y)});ctx.globalAlpha=1;for(let i=0;i<3;i++){const y=trackY(i);ctx.fillStyle='rgba(25,31,38,.9)';ctx.fillRect(0,y-24,W,48);ctx.fillStyle='#aab6bf';ctx.fillRect(0,y-18,W,5);ctx.fillRect(0,y+13,W,5);ctx.fillStyle='rgba(255,255,255,.18)';for(let x=(elapsed*110)%54-54;x<W;x+=54)ctx.fillRect(x,y-5,30,10)}}
function drawTrain(x,y){const col=TRAIN_COLORS[train];ctx.save();if(bounce>0)ctx.translate((Math.random()-.5)*9,(Math.random()-.5)*7);const w=Math.min(190,W*.33),h=54;ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x+w*.48,y+31,w*.46,10,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=col[0];ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,17);ctx.fill();ctx.fillStyle=col[1];ctx.fillRect(x-w/2,y+4,w*.88,10);ctx.fillStyle=col[2];ctx.fillRect(x-w/2,y+15,w*.93,5);ctx.fillStyle='#23415a';for(let i=0;i<6;i++)ctx.fillRect(x-w*.4+i*w*.12,y-15,w*.075,11);ctx.fillStyle='#ffe784';ctx.beginPath();ctx.arc(x+w*.43,y-2,4,0,Math.PI*2);ctx.fill();ctx.font='17px sans-serif';ctx.fillStyle='#152a38';ctx.textAlign='center';ctx.fillText(train,x-w*.31,y+1);ctx.restore()}
function spawn(){const bad=Math.random()<.48,ln=Math.floor(Math.random()*3);if(bad&&objects.some(o=>o.bad&&o.x>W*.55))return;objects.push({bad,lane:ln,x:W+70,hit:false,icon:bad?'🚧':Math.random()<.25?'🎫':'⭐'})}
function callout(text,bad=false){const e=$('callout');e.textContent=text;e.style.background=bad?'#ff9e9e':'#ffd64f';e.classList.add('show');clearTimeout(callout.t);callout.t=setTimeout(()=>e.classList.remove('show'),850)}
function updateObjects(dt){const speed=165+Math.min(elapsed,35)*1.3;for(let i=objects.length-1;i>=0;i--){const o=objects[i];o.x-=speed*dt;const y=trackY(o.lane);ctx.font=(o.bad?52:44)+'px sans-serif';ctx.textAlign='center';ctx.fillText(o.icon,o.x,y+16);if(!o.hit&&o.lane===lane&&o.x<W*.32&&o.x>W*.08){o.hit=true;if(o.bad){bounce=.38;sfx.bump();callout('SAFE BOUNCE!',true)}else if(o.icon==='🎫'){tickets++;$('tickets').textContent=tickets;sfx.ticket();callout('TICKET!')}else{stars++;$('stars').textContent=stars;sfx.star();callout(['GREAT!','NICE!','STAR!'][stars%3])}}if(o.x<-90)objects.splice(i,1)}}
function move(d){if(!active||paused)return;const n=Math.max(0,Math.min(2,lane+d));if(n!==lane){lane=n;sfx.move()}}
function frame(now){if(!active)return;const dt=Math.min((now-last)/1000||0,.05);last=now;if(!paused){elapsed+=dt;bounce=Math.max(0,bounce-dt);spawnClock-=dt;if(spawnClock<=0){spawn();spawnClock=1.7+Math.random()*1.15}bg(dt);updateObjects(dt);drawTrain(Math.max(100,W*.2),trackY(lane));$('routeFill').style.width=Math.min(100,elapsed/TRIP_TIME*100)+'%';if(elapsed>=TRIP_TIME){finish();return}}raf=requestAnimationFrame(frame)}
async function startTrip(){ac();$('start').classList.add('hidden');$('finish').classList.add('hidden');$('tutorial').classList.add('show');active=false;cancelAnimationFrame(raf);elapsed=0;lane=1;stars=0;tickets=0;objects=[];spawnClock=4;$('stars').textContent='0';$('tickets').textContent='0';$('routeFill').style.width='0';sfx.depart();await new Promise(r=>setTimeout(r,2200));$('tutorial').classList.remove('show');active=true;last=performance.now();raf=requestAnimationFrame(frame)}
function finish(){active=false;cancelAnimationFrame(raf);const count=(Number(localStorage.getItem('trainAdventureStamps'))||0)+1;localStorage.setItem('trainAdventureStamps',String(count));$('resultStars').textContent=stars;$('stampCount').textContent=count;$('finish').classList.remove('hidden');sfx.arrive()}
document.querySelectorAll('.trainChoice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.trainChoice').forEach(x=>x.classList.remove('on'));b.classList.add('on');train=b.dataset.train;sfx.move()});document.querySelectorAll('.routeChoice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.routeChoice').forEach(x=>x.classList.remove('on'));b.classList.add('on');route=b.dataset.route;sfx.move()});
$('up').addEventListener('pointerdown',e=>{e.preventDefault();move(-1)});$('down').addEventListener('pointerdown',e=>{e.preventDefault();move(1)});addEventListener('keydown',e=>{if(e.key==='ArrowUp')move(-1);if(e.key==='ArrowDown')move(1)});$('play').onclick=startTrip;$('again').onclick=()=>{$('finish').classList.add('hidden');$('start').classList.remove('hidden')};function home(){location.href='index.html'}$('home').onclick=home;$('startHome').onclick=home;$('finishHome').onclick=home;
$('sound').onclick=()=>{muted=!muted;localStorage.setItem('trainAdventureMuted',muted?'1':'0');if(muted&&audio)audio.suspend();updateSound()};document.addEventListener('visibilitychange',()=>{paused=document.hidden;if(!paused&&active){last=performance.now();if(audio&&!muted)audio.resume().catch(()=>{})}});addEventListener('resize',resize);resize();updateSound();bg(0);drawTrain(Math.max(100,W*.2),trackY(lane));
</script>
</body>
</html>
