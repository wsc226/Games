<script id="train-scripts" type="application/json">{"_version":1,"_status":"draft - Japanese + English, ready for voice cloning","_readme":"All spoken lines for train-205.html. Edit 'lines' (ja/en templates). Station lines (per_station) can use {name} (this station), {next} (the next station) and {transfer}. 'only': 'transfer' = stations with connecting lines, 'last' = Utsunomiya only; 'skip_first' / 'skip_last' leave out Tokyo / Utsunomiya. Then run `node tools/build_train_205.mjs` - it regenerates 'renders' (every final sentence with its target audio file) and re-embeds this file into train-205.html. Any render whose audio file exists is played; otherwise the game falls back to the iPad's text-to-speech using the same text and language.","_how_to_record":"Clone each voice in 'voices', then render every entry in 'renders' to its 'file' path (mp3). Japanese files live under audio/train-205/ja/, English under audio/train-205/en/; 'common' folders are shared by all stations. Each render has a 'when' note saying when the game plays it. Real sound effects (horn, door chime, departure melodies, crossing bell...) can be dropped in at the paths listed in 'sfx' - any file that exists replaces the built-in synthesised sound. See audio/train-205/README.md.","voices":{"conductor":{"description":"Train conductor (車掌). Calm, nasal, sing-song JR PA voice.","rate":0.95,"pitch":1},"auto":{"description":"Automatic train announcement. Clear, bright female voice (JR East style).","rate":0.95,"pitch":1.1},"platform":{"description":"Station platform announcer. Echoey, polite female voice.","rate":0.95,"pitch":1.05},"driver":{"description":"The player's train driver callouts (指差喚呼). Short, crisp, enthusiastic.","rate":1.05,"pitch":1},"announcer":{"description":"Race announcer. Excited, cheerful, kid-friendly (like a sports-day MC).","rate":1.05,"pitch":1.15}},"lines":[{"id":"welcome","role":"auto","when":"Game start at Tokyo","ja":"今日も、JR東日本をご利用いただきまして、ありがとうございます。この電車は、宇都宮線、宇都宮行きです。","en":"Thank you for riding JR East. This is the Utsunomiya Line train bound for Utsunomiya."},{"id":"approaching","role":"auto","when":"700 m before a station","per_station":true,"skip_first":true,"skip_last":true,"ja":"まもなく、{name}です。お出口は、左側です。","en":"We will soon make a brief stop at {name}. The doors on the left side will open."},{"id":"approaching_last","role":"auto","when":"700 m before Utsunomiya","per_station":true,"only":"last","ja":"まもなく、終点、{name}です。お出口は、左側です。今日も、ご乗車ありがとうございました。","en":"We will soon arrive at {name}, the last stop. The doors on the left side will open. Thank you for riding with us today."},{"id":"transfer","role":"auto","when":"After the approaching announcement","per_station":true,"only":"transfer","skip_first":true,"ja":"{transfer}は、お乗り換えです。","en":"Please change here for {transfer}."},{"id":"arrived","role":"conductor","when":"Doors open at a station","per_station":true,"skip_first":true,"skip_last":true,"ja":"{name}、{name}です。ご乗車、ありがとうございます。","en":"{name}. {name}. Thank you for riding."},{"id":"arrived_last","role":"conductor","when":"Doors open at Utsunomiya","per_station":true,"only":"last","ja":"{name}、{name}、終点です。お忘れ物の、ございませんよう、ご注意ください。","en":"{name}. This is the last stop. Please make sure you have all your belongings."},{"id":"doors_open","role":"auto","when":"Doors start opening","ja":"ドアが開きます。","en":"The doors are opening."},{"id":"doors_close","role":"conductor","when":"Doors start closing (after the departure melody)","ja":"ドアが閉まります。ご注意ください。","en":"The doors are closing. Please be careful."},{"id":"next","role":"auto","when":"Leaving a station","per_station":true,"skip_last":true,"ja":"次は、{next}です。","en":"The next station is {next}."},{"id":"platform_arriving","role":"platform","when":"Platform camera, train coming","ja":"まもなく、1番線に、宇都宮行きが、参ります。危ないですから、黄色い線の内側まで、お下がりください。","en":"A train bound for Utsunomiya is now arriving at track number one. For your safety, please stand behind the yellow line."},{"id":"platform_departing","role":"platform","when":"Platform camera, departure melody","ja":"1番線、ドアが閉まります。ご注意ください。","en":"The doors on track number one are closing. Please be careful."},{"id":"close_doors_first","role":"driver","when":"Go pressed while the doors are open","ja":"ドアを しめてから、しゅっぱつ しよう！","en":"Close the doors first, then we can go!"},{"id":"press_doors","role":"driver","when":"Stopped at a platform (hint)","ja":"ドアボタンを おしてね！","en":"Press the Doors button!"},{"id":"perfect_stop","role":"driver","when":"Stopped right at the 3 marker","ja":"ぴったり、ていし！すごい！","en":"Perfect stop! Great job!"},{"id":"passed_station","role":"driver","when":"Drove past a station","ja":"あっ、とおりすぎちゃった！つぎの えきで とまろう。","en":"Oops, we passed the station! Let's stop at the next one."},{"id":"departure_ok","role":"driver","when":"Departing, signal green","ja":"しゅっぱつ、しんこう！","en":"Signal is green. Let's go!"},{"id":"race_intro","role":"announcer","when":"Race start at Omiya","ja":"大宮から宇都宮まで、HU300と、きょうそうだ！","en":"It's a race from Omiya to Utsunomiya against the HU300!"},{"id":"race_go","role":"announcer","when":"Countdown reaches GO","ja":"スタート！","en":"Go!"},{"id":"race_lead_205","role":"announcer","when":"The 205 takes the lead","ja":"205系が、リードしています！","en":"The 205 is in the lead!"},{"id":"race_lead_hu300","role":"announcer","when":"The HU300 takes the lead","ja":"HU300が、前に出ました！がんばれ！","en":"The HU300 is ahead! Keep going!"},{"id":"race_close","role":"announcer","when":"Trains neck and neck","ja":"せっせんです！どっちが勝つかな？","en":"It's a close race! Who will win?"},{"id":"race_hidden","role":"announcer","when":"HU300 leaves on its own track","ja":"あれ？HU300が、見えなくなった！","en":"Where did the HU300 go?"},{"id":"race_back","role":"announcer","when":"HU300 comes back","ja":"HU300が、もどってきた！","en":"The HU300 is back!"},{"id":"race_final","role":"announcer","when":"About 1 km before the finish","ja":"もうすぐゴール、宇都宮です！","en":"Almost at the finish line, Utsunomiya!"},{"id":"race_win","role":"announcer","when":"The 205 wins","ja":"やったー！205系の勝ち！おめでとう！","en":"Hooray! The 205 wins! Congratulations!"},{"id":"race_lose","role":"announcer","when":"The HU300 wins","ja":"HU300の勝ち！つぎは、がんばろう！","en":"The HU300 wins this time! Let's try again!"},{"id":"yellow_signal","role":"driver","when":"A yellow (caution) signal ahead","ja":"きいろ しんごう！スピードを おとそう。","en":"Yellow signal! Let's slow down."},{"id":"slow_good","role":"driver","when":"He pressed Slow for the yellow signal","ja":"じょうず！ゆっくり すすもう。","en":"Good job! Nice and slow."},{"id":"green_again","role":"driver","when":"Past the yellow signal, next one is green","ja":"みどり しんごう。はやく してもいいよ！","en":"Green signal. We can go fast again!"},{"id":"tunnel","role":"driver","when":"Coming up to a tunnel","ja":"トンネルに はいるよ！","en":"Here comes a tunnel!"},{"id":"bridge","role":"driver","when":"Coming up to a big river bridge","ja":"おおきな てっきょうを わたるよ！","en":"We're crossing a big bridge!"},{"id":"crossing_horn","role":"driver","when":"Horn sign before a level crossing","ja":"ふみきりだ。ホーンを ならそう！","en":"A railroad crossing! Let's blow the horn!"},{"id":"shinkansen","role":"driver","when":"An E5 Shinkansen passes on the viaduct","ja":"しんかんせんが きた！はやい！","en":"Here comes the Shinkansen! So fast!"}],"sfx":{"horn":"audio/train-205/sfx/horn.mp3","doorOpen":"audio/train-205/sfx/doorOpen.mp3","doorChime":"audio/train-205/sfx/doorChime.mp3","doorThump":"audio/train-205/sfx/doorThump.mp3","air":"audio/train-205/sfx/air.mp3","squeal":"audio/train-205/sfx/squeal.mp3","arrive":"audio/train-205/sfx/arrive.mp3","switch":"audio/train-205/sfx/switch.mp3","tram":"audio/train-205/sfx/tram.mp3","crossing_bell":"audio/train-205/sfx/crossing_bell.mp3","click":"audio/train-205/sfx/click.mp3","wiper":"audio/train-205/sfx/wiper.mp3","melody_tokyo":"audio/train-205/sfx/melody_tokyo.mp3","melody_ueno":"audio/train-205/sfx/melody_ueno.mp3","melody_akabane":"audio/train-205/sfx/melody_akabane.mp3","melody_urawa":"audio/train-205/sfx/melody_urawa.mp3","melody_omiya":"audio/train-205/sfx/melody_omiya.mp3","melody_kuki":"audio/train-20 // ===== 03-track.js =====
/* ═══ ROUTE ═══
   The whole line is one centre-line built from straights and arcs, sampled
   every metre. Everything (trains, signals, stations, cameras) is positioned
   by distance along it: s (metres from Tokyo). Tracks are lateral offsets.
   heading h: 0 = north (-z), positive = turning right (east, +x).
   Ground is at y = GROUND; elevAt(s) lifts the rails (viaducts, bridges).   */
const GROUND = -.62;
const TRACK = {
  step: 1, n: 0, px: null, pz: null, ph: null, len: 0,
  gauge: 1.067,
  PLAYER: 2.0, OPP: -2.0,              // lateral offsets (left of centre-line = +)
  STATION_HALF: 230,                   // straight length each side of a station
  PLAT_HALF: 85,                       // platform half-length
  STOP_AHEAD: 42,                      // the "3" stop marker, metres past station centre
};
const CURVES = [];                     // {s0, s1, k}
const FEAT = { elev: [], rivers: [], tunnels: [], crossings: [], viaducts: [] };

function buildRoute() {
  R = mulberry(205);
  const segs = [];
  let s = 0, hNet = 0;
  const stS = [];
  STATIONS.forEach(st => {
    stS.push(s + TRACK.STATION_HALF);
    if (!st.leg) { segs.push({ len: TRACK.STATION_HALF * 2 + 400, k: 0 }); return; }
    const M = st.leg - TRACK.STATION_HALF * 2;
    const a1 = M * rr(.16, .22), a2 = M * rr(.16, .22);
    const st1 = M * rr(.2, .26), st2 = M * rr(.12, .18);
    const st3 = M - a1 - a2 - st1 - st2;
    let ang1 = rr(.22, .5) * (R() < .5 ? -1 : 1);
    if (Math.abs(hNet + ang1) > .7) ang1 = -ang1;
    let ang2 = -ang1 * rr(.5, 1.3);
    if (Math.abs(hNet + ang1 + ang2) > .6) ang2 = -(hNet + ang1) * .8;
    hNet += ang1 + ang2;
    segs.push({ len: TRACK.STATION_HALF * 2 + st1, k: 0 }, { len: a1, k: ang1 / a1 }, { len: st2, k: 0 }, { len: a2, k: ang2 / a2 }, { len: st3, k: 0 });
    s += st.leg;
  });
  let acc = 0; for (const g of segs) { if (g.k) CURVES.push({ s0: acc, s1: acc + g.len, k: g.k }); acc += g.len; }
  const total = acc;
  const n = Math.ceil(total / TRACK.step) + 2;
  const px = new Float64Array(n), pz = new Float64Array(n), ph = new Float64Array(n);
  let x = 0, z = 0, h = 0, segI = 0, segUsed = 0;
  for (let i = 0; i < n; i++) {
    px[i] = x; pz[i] = z; ph[i] = h;
    const seg = segs[Math.min(segI, segs.length - 1)];
    const hm = h + seg.k * TRACK.step / 2;
    x += Math.sin(hm) * TRACK.step; z += -Math.cos(hm) * TRACK.step; h += seg.k * TRACK.step;
    segUsed += TRACK.step; if (segUsed >= seg.len && segI < segs.length - 1) { segI++; segUsed = 0; }
  }
  Object.assign(TRACK, { n, px, pz, ph, len: total });
  STATIONS.forEach((st, i) => { st.s = stS[i]; st.idx = i; st.stopS = st.s + TRACK.STOP_AHEAD; st.big = ['tokyo', 'ueno', 'omiya', 'utsunomiya'].includes(st.id); });
  planFeatures();
  planRace();
  planTracks();
}
const ST = id => STATIONS.find(s => s.id === id);

/* ── features along the line: viaducts, rivers + bridges, tunnels, level crossings ── */
function planFeatures() {
  const via = (a, b, h) => { FEAT.viaducts.push({ a, b }); FEAT.elev.push({ a, b, h, r: 260, type: 'viaduct' }); };
  via(ST('tokyo').s + 600, ST('ueno').s - 600, 7.5);
  via(ST('urawa').s + 560, ST('omiya').s - 560, 7.5);
  const river = (name, en, s, water, flood, h, color) => {
    const half = water / 2 + flood;
    FEAT.rivers.push({ name, en, s, water, flood, half, color });
    FEAT.elev.push({ a: s - half - 30, b: s + half + 30, h, r: 250, type: 'embank' });
  };
  river('荒川', 'Arakawa', ST('akabane').s + 610, 110, 70, 8.5, 0x5f7f99);
  river('元荒川', 'Moto-Arakawa', ST('omiya').s + 980, 26, 14, 4.5, 0x7a4636);
  river('利根川', 'Tone River', ST('koga').s - 760, 140, 80, 9, 0x8a3b2c);
  river('思川', 'Omoi River', ST('oyama').s - 820, 40, 30, 5, 0x3f6d8a);
  const tun = (name, a, b) => FEAT.tunnels.push({ name, a, b, hill: rr(26, 40) });
  tun('第一小山トンネル', ST('oyama').s + 700, ST('oyama').s + 1060);
  tun('石橋トンネル', ST('ishibashi').s + 560, ST('ishibashi').s + 880);
  tun('古河トンネル', ST('koga').s + 520, ST('koga').s + 760);
  // level crossings (suburb / country), away from everything else
  for (let i = 4; i < STATIONS.length - 1; i++) {
    const st = STATIONS[i], nx = STATIONS[i + 1];
    for (const f of [.3, .72]) {
      const s = Math.round(lerp(st.s, nx.s, f));
      if (elevAt(s) > .01 || inTunnelZone(s, 120) || FEAT.rivers.some(r => Math.abs(r.s - s) < r.half + 350)) continue;
      FEAT.crossings.push({ s });
    }
  }
}
/* ── the HU300's route: runs beside the line, but takes its own way round hills
      and on a couple of detours, so it disappears and comes back ── */
const RACE = { base: -19, detours: [] };
function raceOff(s) {
  let o = RACE.base;
  for (const d of RACE.detours) {
    if (s <= d.a - d.r || s >= d.b + d.r) continue;
    const k = s < d.a ? smooth((s - (d.a - d.r)) / d.r) : s > d.b ? smooth(((d.b + d.r) - s) / d.r) : 1;
    o = Math.min(o, lerp(RACE.base, d.to, k));
  }
  return o;
}
function planRace() {
  for (const t of FEAT.tunnels) RACE.detours.push({ a: t.a - 140, b: t.b + 140, r: 300, to: -345, why: 'hill' });
  const busy = (a, b) => FEAT.rivers.some(r => r.s + r.half + 60 > a && r.s - r.half - 60 < b) || FEAT.crossings.some(c => c.s > a - 40 && c.s < b + 40) ||
    RACE.detours.some(d => d.b + d.r > a && d.a - d.r < b) || STATIONS.some(st => st.s + 330 > a && st.s - 330 < b) || elevAt(a) > 0 || elevAt(b) > 0;
  let n = 0;
  for (let i = ST('omiya').idx; i < STATIONS.length - 1 && n < 2; i++) {
    const c = (STATIONS[i].s + STATIONS[i + 1].s) / 2;
    for (const dc of [0, -300, 300]) {
      const a = c + dc - 220, b = c + dc + 220;
      if (!busy(a - 260, b + 260)) { RACE.detours.push({ a, b, r: 260, to: -150, why: 'detour' }); n++; break; }
    }
  }
}
function inTunnel(s) { return FEAT.tunnels.some(t => s > t.a && s < t.b); }
function inTunnelZone(s, pad = 0) { return FEAT.tunnels.some(t => s > t.a - 160 - pad && s < t.b + 160 + pad); }
function riverAt(s) { return FEAT.rivers.find(r => Math.abs(s - r.s) < r.half); }
function featureAt(s) { for (const e of FEAT.elev) if (s > e.a - e.r && s < e.b + e.r) return e; return null; }
// elevation of the rail top above the base level (0); ground is GROUND
function elevAt(s) {
  let y = 0;
  for (const e of FEAT.elev) {
    if (s < e.a - e.r || s > e.b + e.r) continue;
    const k = s < e.a ? smooth((s - (e.a - e.r)) / e.r) : s > e.b ? smooth(((e.b + e.r) - s) / e.r) : 1;
    y = Math.max(y, e.h * k);
  }
  return y;
}
function zoneAt(s) {
  let z = STATIONS[0].zone;
  for (const st of STATIONS) if (s > st.s - 900) z = st.zone;
  return z;
}

const _tf = { x: 0, z: 0, h: 0 };

/* ═══ TRAIN SOUNDS (synthesised) ═══ */
const SND = { on: false };
function startTrainSound() {
  if (!A || SND.on) return; SND.on = true;
  const out = A.createGain(); out.gain.value = .9; out.connect(master); SND.out = out;
  // motor hum (DC traction motor) + gear whine

  const m1f = A.createBiquadFilter(); m1f.type = 'lowpass'; m1f.frequency.value = 400; m1f.Q.value = 2;
  const m1g = A.createGain(); m1g.gain.value = 0; m1.connect(m1f); m1f.connect(m1g); m1g.connect(out);
  const m2 = A.createOscillator(); m2.type = 'sine';
  const m2g = A.createGain(); m2g.gain.value = 0; m2.connect(m2g); m2g.connect(out);
  const m3 = A.createOscillator(); m3.type = 'triangle';
  const m3g = A.createGain(); m3g.gain.value = 0; m3.connect(m3g); m3g.connect(out);

  const rg = A.createGain(); rg.gain.value = 0; rn.connect(rf); rf.connect(rg); rg.connect(out);

  const cpf = A.createBiquadFilter(); cpf.type = 'lowpass'; cpf.frequency.value = 160;
  const cpg = A.createGain(); cpg.gain.value = 0; cp.connect(cpf); cpf.connect(cpg); cpg.connect(out);
  [m1, m2, m3, rn, cp].forEach(o => o.start());

}
function stopTrainSound() {
  if (!SND.on) return; SND.on = false;
  try { SND.out.gain.setTargetAtTime(0, A.currentTime, .05); const o = SND.out; setTimeout(() => o.disconnect(), 300); } catch (e) {}
  ['m1', 'm2', 'm3', 'cp'].forEach(k => { try { SND[k] && SND[k].stop(); } catch (e) {} });
}
function updateTrainSound(dt, v, power, braking, inside, env = {}) {
  if (!SND.on) return;
  const t = A.currentTime, kmh = v * 3.6;
  const p = power ? 1 : 0;
  SND.m1.frequency.setTargetAtTime(28 + kmh * 1.6, t, .1);
  SND.m1f.frequency.setTargetAtTime(220 + kmh * 9, t, .1);
  SND.m1g.gain.setTargetAtTime(v > .2 ? (.035 + .05 * p) * Math.min(1, kmh / 15) : 0, t, .15);
  SND.m2.frequency.setTargetAtTime(90 + kmh * 13.5, t, .1);
  SND.m2g.gain.setTargetAtTime(v > .2 ? (.012 + .03 * p) * Math.min(1, kmh / 20) : 0, t, .15);
  SND.m3.frequency.setTargetAtTime(180 + kmh * 27, t, .1);
  SND.m3g.gain.setTargetAtTime(v > .2 ? .006 + .012 * p : 0, t, .15);
  // tunnels echo (louder, boomier); truss bridges rumble

  SND.rf.frequency.setTargetAtTime((250 + kmh * 9) * (tun ? .6 : 1) * (br ? .7 : 1), t, .2);
  SND.rg.gain.setTargetAtTime(Math.min(.16, v * .006) * (inside ? .7 : 1) * (1 + 1.2 * tun + .8 * br), t, .2);
  SND.cpg.gain.setTargetAtTime(v < .3 ? .025 : 0, t, .4);
  // rail joints every 25 m: "ta-tan … ta-tan"

  if (SND.jointAcc >= 25) {

    const g = Math.min(.5, .12 + v * .012);
    for (const d of [0, 2.1, 13.9, 16.0, 20.5 + 0, 20.5 + 2.1]) {
      const w = d / Math.max(v, .5); if (w > 2.5) continue;

    }

/* horn: held while the button is pressed (空気笛 + 電子ホーン mix) */

function hornOn() {

  const f = A.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = .7; f.connect(g);

/* ═══ DRIVING ═══

   Fast / Slow: target speed.                                                   */

  train: null, state: 'stopped',     // 'stopped' | 'go' | 'braking'

  FAST: 30, SLOW: 15,                // m/s  (108 km/h / 54 km/h)
  nextIdx: 1, arrivedAt: 0,

function targetSpeed() { return DRV.fast ? (G.mode === 'race' ? 33 : DRV.FAST) : DRV.SLOW; }

}

function pressGo() {
  if (G.mode === 'race' && (!RC.started || RC.done)) return;

    bigMsg('Close the doors first! 🚪<small>ドアを しめてね</small>', 2000);
    say('close_doors_first');
    const d = $('b-door'); d.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.18)' }, { transform: 'scale(1)' }], { duration: 400, iterations: 2 });
    return;
  }

  if (DRV.state === 'go') { // → stop in 2 seconds
    DRV.state = 'braking'; DRV.brakeDecel = Math.max(DRV.train.v / 2, .5);

  } else {
    if (DRV.train.s >= STATIONS[STATIONS.length - 1].stopS - 2) { bigMsg('End of the line!<small>しゅうてん</small>', 2200); return; }
    DRV.state = 'go';

/* ═══ STRUCTURES: viaducts, embankments, truss bridges, rivers, tunnels + hills ═══ */
const SMAT = {};

/* ── per-chunk: viaduct deck / fill walls / piers, embankments, bridge decks, tunnel tube ── */
function buildStructures(s0, s1, group) {

    const prof = [[-5.8, GROUND, 1]]; for (let i = 0; i <= 12; i++) { const an = Math.PI - i / 12 * Math.PI; prof.push([Math.cos(an) * 5.8, 3.4 + Math.sin(an) * 5.8, 1]); } prof.push([5.8, GROUND, 1]); prof.push([-5.8, GROUND + .01, 1]);

    const lamps = [];

      const g = UNIT_BOX.clone().scale(.5, .14, .12); const p = posG(s, lat, 3.2); g.rotateY(yawAt(s)); g.translate(p.x, p.y, p.z); lamps.push(g);

function buildViaduct(a, b, group) {

  const deck = s => { const [l, r] = E(s); return [[l, -1.7], [l, .45], [l + .3, .45], [l + .3, -.62], [r - .3, -.62], [r - .3, .45], [r, .45], [r, -1.7], [l, -1.7]]; };

  const lowBottom = s => { const e = elevAt(s); const k = smooth((e - 2.6) / .8); return lerp(GROUND, e - 1.7, k); };
  const wallL = s => [[E(s)[0], lowBottom(s), 1], [E(s)[0], -1.7]], wallR = s => [[E(s)[1], -1.7], [E(s)[1], lowBottom(s), 1]];
  group.add(new THREE.Mesh(sweep(wallL, a, b, 5, 0, { uLen: 3, vLen: 3 }), SMAT.concrete), new THREE.Mesh(sweep(wallR, a, b, 5, 0, { uLen: 3, vLen: 3 }), SMAT.concrete));

    const [l, r] = E(s);
    for (const lat of [l + 2.8, r - 2.8, ...(r - l > 20 ? [(l + r) / 2] : [])]) {
      const h = e - 1.7 - GROUND, g = UNIT_BOX.clone().scale(1.1, h, 1.1), p = posG(s, lat, GROUND + h / 2);
      g.rotateY(yawAt(s)); g.translate(p.x, p.y, p.z); geos.push(g);
    }
    const cb = UNIT_BOX.clone().scale(1.2, .9, r - l - 4.4), p = posAt(s, (l + r) / 2, -2.15); cb.rotateY(yawAt(s)); cb.translate(p.x, p.y, p.z); geos.push(cb);
  }

}
function buildEmbankment(a, b, group) {

  for (let s = a; s <= b + .01; s += 2.5) {
    const onBridge = !!riverAt(s);
    if (!onBridge && !cur) cur = [s, s]; if (!onBridge && cur) cur[1] = s;
    if (onBridge && cur) { ranges.push(cur); cur = null; }
  }
  if (cur) ranges.push(cur);

    const prof = s => { const [mn, mx] = extentsAt(s), e = elevAt(s), w = 1.6 * Math.max(0, e - .33);
      return [[mn - 4.6 - w, GROUND - .02, 1], [mn - 4.6, -.95], [mx + 4.6, -.95], [mx + 4.6 + w, GROUND - .02, 1]]; };
    const m = new THREE.Mesh(sweep(prof, x0, x1, 4, 0, { uLen: 10, vLen: 10 }), SMAT.grass); m.receiveShadow = true; group.add(m);

/* ── beams between two world points (for trusses, pylons) ── */
const _bx = new THREE.Vector3(), _by = new THREE.Vector3(), _bz = new THREE.Vector3(), _bm = new THREE.Matrix4();
function beam(p1, p2, t, geos) {
  const len = p1.distanceTo(p2); if (len < .01) return;
  const g = UNIT_BOX.clone().scale(t, len, t);
  _by.subVectors(p2, p1).normalize();
  _bx.set(0, 1, 0); if (Math.abs(_by.y) > .95) _bx.set(1, 0, 0);
  _bz.crossVectors(_bx, _by).normalize(); _bx.crossVectors(_by, _bz).normalize();
  _bm.makeBasis(_bx, _by, _bz); _bm.setPosition((p1.x + p2.x) / 2, (p1.y + p2.y) / 2, (p1.z + p2.z) / 2);

}
/* ── rivers: water, flood plain, levees, truss bridge with piers ── */
function buildRivers() {
  for (const r of FEAT.rivers) {
    const g = new THREE.Group();
    const c = posG(r.s, 0, GROUND);
    const ang = yawAt(r.s) + Math.PI / 2 + rr(-.18, .18);           // river runs across the line
    r.cx = c.x; r.cz = c.z; r.dir = new THREE.Vector3(Math.cos(ang), 0, -Math.sin(ang));
    const L = 3200;
    const plane = (w, y, mat) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(L, w).rotateX(-Math.PI / 2), mat); m.position.set(c.x, y, c.z); m.rotation.y = ang; m.receiveShadow = true; g.add(m); return m; };
    const wt = SMAT.water.clone(); wt.map = SMAT.water.map.clone(); wt.map.repeat.set(L / 40, r.water / 40); wt.map.needsUpdate = true; r.waterMat = wt;

    for (const sd of [-1, 1]) {

    const tg = [], pg = [];
    const P = (s, lat, y) => posAt(s, lat, y);
    const small = r.water < 50;
    for (let i = 0; i < N; i++) {

      if (!small) {

        for (const sd of [-1, 1]) {
          const lat = sd * W;
          beam(P(sA, lat, -.6), P(sB, lat, -.6), .5, tg);                                   // bottom chord
          beam(P(sA + Ls / panels / 2, lat, H), P(sB - Ls / panels / 2, lat, H), .5, tg);   // top chord

            const b0 = sA + k * Ls / panels, b1 = b0 + Ls / panels, tm = (b0 + b1) / 2;

          }

          if (k < panels - 1) { const t2 = tm + Ls / panels; beam(P(tm, -4.9, H), P(t2, 4.9, H), .18, tg); beam(P(tm, 4.9, H), P(t2, -4.9, H), .18, tg); }

      // pier under each joint

        const rp = posG(s, raceOff(s), GROUND - 1 + h / 2), rg2 = UNIT_BOX.clone().scale(2.4, h, 4.5); rg2.rotateY(yawAt(s)); rg2.translate(rp.x, rp.y, rp.z); pg.push(rg2);

    const bp = posG(r.s - r.half - 22, -14, GROUND + 6.5); bd.position.copy(bp); bd.rotation.y = yawAt(r.s) + Math.PI / 2 + .5; g.add(bd);

}
function inRiver(x, z, pad = 20) {

/* ── tunnels: hill heightfield (with a hole at each portal) + portals ── */
function hillHeight(t, s, lat) {

  let base;
  if (s < t.a) base = P * smooth((s - (t.a - ramp)) / ramp);
  else if (s > t.b) base = P * smooth(((t.b + ramp) - s) / ramp);
  else base = P + (t.hill - P) * Math.sin(Math.PI * (s - t.a) / (t.b - t.a)) ** .8;
  let h = base * Math.exp(-((lat / 130) ** 2)) * (1 + .12 * Math.sin(s * .021 + lat * .043) + .08 * Math.sin(lat * .09 - s * .013));

/* ═══ EXTRAS: high-voltage pylons, oncoming trains, tunnel lighting ═══ */
function pylonGeometry() {
  const body = new THREE.CylinderGeometry(1.1, 4.4, 40, 4, 1, true).rotateY(Math.PI / 4).translate(0, 20, 0);
  const top = new THREE.CylinderGeometry(.35, 1.1, 8, 4, 1, true).rotateY(Math.PI / 4).translate(0, 44, 0);
  const arms = [];
  for (const [y, w] of [[30, 13], [35.5, 15], [41, 12]]) arms.push(UNIT_BOX.clone().scale(1.1, 1.1, w).translate(0, y, 0));
  arms.push(UNIT_BOX.clone().scale(.6, .6, 5).translate(0, 47.6, 0));
  return { body: mergeGeometries([body, top]), arms: mergeGeometries(arms) };
}
const PYLON_ATTACH = [[29, 6.5], [29, -6.5], [34.5, 7.5], [34.5, -7.5], [40, 6], [40, -6]];
function buildPylons() {
  const lt = latticeTex(); lt.repeat.set(4, 14);
  const mBody = new THREE.MeshStandardMaterial({ map: lt, color: 0xb8bec2, metalness: .5, roughness: .5, alphaTest: .5, side: THREE.DoubleSide });
  const { body, arms } = pylonGeometry();
  const towers = []; // {p, yaw}
  // a line running alongside the railway, then one line crossing over it
  for (let s = ST('kuki').s - 600; s < ST('utsunomiya').s - 900; s += 330) {
    const lat = 125 + 30 * Math.sin(s / 900);
    const p = posG(s, lat, GROUND); if (inRiver(p.x, p.z, 0) || inHill(s, lat) || shkBlocked(s, lat, 8)) continue;
    towers.push({ p, yaw: yawAt(s), line: 0, s });
  }
  const cs = ST('koga').s + 450;
  for (let lat = -1350; lat <= 1350; lat += 300) { const p = posG(cs + lat * .15, lat, GROUND); towers.push({ p, yaw: yawAt(cs) + Math.PI / 2 - .15, line: 1 }); }
  const ib = new THREE.InstancedMesh(body, mBody, towers.length), ia = new THREE.InstancedMesh(arms, MAT.latticeB, towers.length);
  const o = new THREE.Object3D();
  towers.forEach((t, i) => { o.position.copy(t.p); o.rotation.set(0, t.yaw, 0); o.updateMatrix(); ib.setMatrixAt(i, o.matrix); ia.setMatrixAt(i, o.matrix); });
  ib.castShadow = true; W.scene.add(ib, ia);
  // insulators + sagging conductors between consecutive towers of the same line
  const pts = [], insG = [];
  const att = (t, k, out) => { const [y, z] = PYLON_ATTACH[k]; out.set(0, y - 2.6, z).applyAxisAngle(_up, t.yaw).add(t.p); return out; };
  const a = new THREE.Vector3(), b = new THREE.Vector3(), q = new THREE.Vector3(), q2 = new THREE.Vector3();
  towers.forEach(t => { for (let k = 0; k < 6; k++) { att(t, k, a); insG.push(new THREE.CylinderGeometry(.18, .18, 2.6, 6).translate(a.x, a.y + 1.3, a.z)); } });
  for (let i = 0; i < towers.length - 1; i++) {
    const t1 = towers[i], t2 = towers[i + 1]; if (t1.line !== t2.line || t1.p.distanceTo(t2.p) > 700) continue;
    const span = t1.p.distanceTo(t2.p), sagD = span * .035;
    for (let k = 0; k < 7; k++) {
      if (k < 6) { att(t1, k, a); att(t2, k, b); }
      else { a.set(0, 47.8, 2.3).applyAxisAngle(_up, t1.yaw).add(t1.p); b.set(0, 47.8, 2.3).applyAxisAngle(_up, t2.yaw).add(t2.p); }
      for (let j = 0; j < 16; j++) {
        const u0 = j / 16, u1 = (j + 1) / 16;
        q.lerpVectors(a, b, u0); q.y -= sagD * 4 * u0 * (1 - u0);

        pts.push(q.x, q.y, q.z, q2.x, q2.y, q2.z);
      }
    }
  }
  const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  W.scene.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color: 0x3a3c40 })));
  W.scene.add(new THREE.Mesh(mergeGeometries(insG), new THREE.MeshStandardMaterial({ color: 0x9a7a5a, roughness: .5 })));
}

  const om = ST('omiya'), ut = ST('utsunomiya');
  park(om, [{ type: 'E6', nose: 1 }, { type: 'E6' }, { type: 'E6' }, { type: 'E6', nose: -1 }, { type: 'E5', nose: 1 }, { type: 'E5' }, { type: 'E5' }, { type: 'E5', nose: -1 }], -11);
  park(om, [{ type: 'E7', nose: 1 }, { type: 'E7' }, { type: 'E7' }, { type: 'E7', nose: -1 }], 11, -10);
  park(om, [{ type: 'E8', nose: 1 }, { type: 'E8' }, { type: 'E8', nose: -1 }], -3.5, 40);
  park(ut, [{ type: 'E5', nose: 1 }, { type: 'E5' }, { type: 'E5' }, { type: 'E5', nose: -1 }], -11);

/* ── E5s zooming past on the viaduct ── */
const ZOOM = { c: null, active: false, s: 0, v: 0, nextT: 30, lane: 3.5, passed: false };
function buildZoomer() {
  const c = buildConsist([{ type: 'E5', nose: 1 }, { type: 'E5' }, { type: 'E5' }, { type: 'E5' }, { type: 'E5', nose: -1 }]);
  ZOOM.c = c; ZOOM.root = new THREE.Group(); c.cars.forEach(m => ZOOM.root.add(m)); W.scene.add(ZOOM.root); ZOOM.root.visible = false;
}
function updateZoomer(dt, player, camPos) {
  const Z = ZOOM;
  if (!Z.active) {
    // only when the viaduct is near the line and we are not at the very end
    if (G.t > Z.nextT && Math.abs(shkOff(player.s) - 64) < 5 && player.s < TRACK.len - 600) {
      Z.active = true; Z.passed = false; Z.v = 58; Z.lane = 3.5;
      Z.s = player.s - 650; Z.root.visible = true;   // comes up from behind and overtakes
    }

  }
  // slower through the stations
  const nearSt = SHK.stations.some(st => Math.abs(st.s - Z.s) < 350);
  Z.v = damp(Z.v, nearSt ? 30 : 64, .8, dt);
  Z.s += Z.v * dt;
  const a = new THREE.Vector3(), b = new THREE.Vector3();
  for (const m of Z.c.cars) {

    posG(sc + h, shkOff(sc + h) + Z.lane, SHK.rail, a); posG(sc - h, shkOff(sc - h) + Z.lane, SHK.rail, b);
    m.position.set((a.x + b.x) / 2, (a.y + b.y) / 2, (a.z + b.z) / 2); m.rotation.set(0, Math.atan2(-(a.z - b.z), a.x - b.x), 0);
  }
  if (!Z.passed && Z.c.cars[0].position.distanceTo(camPos) < 120) { Z.passed = true; noisy(2.2, .2, 900, .4); noisy(1.6, .1, 3000, .5, .3); }
  if (Z.s > player.s + 2200 || Z.s > TRACK.len - 50) { Z.active = false; Z.root.visible = false; Z.nextT = G.t + rr(35, 70); }
}

// ===== 19-callouts.js =====
/* ═══ CALLOUTS: the driver's friendly voice + the yellow-signal game ═══
   Callouts never interrupt a station announcement (sayIfFree).               */
const CO = { done: {}, caution: [], cautionState: null, wasFast: true, tunnelIn: false, swPassed: {}, huOsc: null };
function planCaution() {
  // a few block signals on our side show yellow (a train ahead!) as we come up to them
  R = mulberry(12345);
  const blocks = SIGNALS.filter(sg => sg.facing > 0 && sg.kind === 'block' && !STATIONS.some(st => Math.abs(st.s - sg.s) < 500));
  CO.caution = [];
  for (let i = 0; i < blocks.length && CO.caution.length < 4; i += Math.max(2, Math.floor(blocks.length / 4))) CO.caution.push(blocks[i]);
  CO.caution.forEach(sg => { sg.caution = true; });
}
function resetCallouts() {
  CO.done = {}; CO.cautionState = null; CO.tunnelIn = false; CO.swPassed = {};
  SIGNALS.forEach(sg => { sg.cautionDone = false; });
}
function updateCallouts(dt, train) {
  const s = train.s, going = DRV.state === 'go' && train.v > 3, reg = G.mode === 'regular';
  // ── yellow signal: slow down, then praise ──
  if (reg) {
    const sg = CO.caution.find(c => !c.cautionDone && c.s > s && c.s - s < 560);
    if (sg && going && CO.cautionState !== sg) {
      CO.cautionState = sg; CO.slowedFor = null;
      bigMsg('Yellow signal! 🟡<small>Press Slow 🐢</small>', 2400);
      say('yellow_signal'); lastCallout = G.t;
      if (DRV.fast) $('b-fast').classList.add('hint');
    }
    if (CO.cautionState && CO.cautionState.s > s && !DRV.fast && CO.slowedFor !== CO.cautionState) {
      CO.slowedFor = CO.cautionState; $('b-fast').classList.remove('hint');
      bigMsg('Good job! 👍<small>Nice and slow</small>', 1800); say('slow_good'); lastCallout = G.t;
    }
    if (CO.cautionState && s > CO.cautionState.s + 5) {
      CO.cautionState.cautionDone = true; CO.cautionState = null; $('b-fast').classList.remove('hint');
      setTimeout(() => { if (G.running && G.mode === 'regular') { bigMsg('Green signal! 🟢<small>Fast is OK again 🐇</small>', 2000); sayIfFree('green_again', {}, 3); } }, 2500);
    }
  }
  // ── tunnels, big bridges, crossings, Shinkansen ──
  if (going) {
    for (const t of FEAT.tunnels) if (t.a - s > 120 && t.a - s < 380 && !CO.done['t' + t.a]) { if (sayIfFree('tunnel')) CO.done['t' + t.a] = 1; }
    for (const r of FEAT.rivers) if (r.water > 60 && r.s - r.half - s > 80 && r.s - r.half - s < 300 && !CO.done['r' + r.s]) { if (sayIfFree('bridge')) { CO.done['r' + r.s] = 1; bigMsg(`${r.en}! 🌉<small>${r.name}</small>`, 2200); } }
    for (const c of FEAT.crossings) if (c.s - s > 150 && c.s - s < 360 && !CO.done['c' + c.s]) { if (sayIfFree('crossing_horn', {}, 5)) { CO.done['c' + c.s] = 1; $('b-horn').classList.add('hint'); setTimeout(() => $('b-horn').classList.remove('hint'), 3500); } }
  }
  if (ZOOM.active && !CO.done['z' + ZOOM.nextT] && Math.abs(ZOOM.s - s) < 300) { if (sayIfFree('shinkansen', {}, 4)) CO.done['z' + ZOOM.nextT] = 1; }
  // ── sounds: entering a tunnel (boom), rolling over switches (clack-clack) ──
  const inT = !!tunnelAt(s);
  if (inT && !CO.tunnelIn && train.v > 5) noisy(1.2, .25, 160, .7);
  CO.tunnelIn = inT;
  for (const sw of SWITCHES) {
    if (Math.abs(sw.off - train.off) > .2 || CO.swPassed[sw.s]) continue;
    if (s > sw.s && s < sw.s + 40 && train.v > 2) {
      CO.swPassed[sw.s] = 1;
      for (let k = 0; k < 6; k++) { const w = k * 2.1 / Math.max(train.v, 1) + (k > 2 ? 13.9 / Math.max(train.v, 1) : 0); noisy(.06, .3, 1300, 1.6, w); tone(220, .05, 'square', .06, 120, w); }
    }
  }
  // ── HU300 motor whine when it is close to the camera ──
  if (A && RC.on && RC.racer) {
    if (!CO.huOsc) {
      const o = A.createOscillator(), g = A.createGain(), f = A.createBiquadFilter(); o.type = 'sawtooth'; f.type = 'bandpass'; f.Q.value = 4;
      g.gain.value = 0; o.connect(f); f.connect(g); g.connect(master); o.start(); CO.huOsc = { o, g, f };
    }
    const d = RC.racer.pos(_coV).distanceTo(W.camera.position), v = RC.racer.v;
    const vol = v > .5 ? .05 * clamp(1 - d / 140, 0, 1) : 0;
    CO.huOsc.g.gain.setTargetAtTime(vol, A.currentTime, .2);
    CO.huOsc.o.frequency.setTargetAtTime(160 + v * 24, A.currentTime, .1); CO.huOsc.f.frequency.setTargetAtTime(500 + v * 40, A.currentTime, .1);

}
const _coV = new THREE.Vector3();
function trainSoundEnv(train) {
  const r = riverAt(train.s - 20);
  return { tunnel: !!tunnelAt(train.s - 20), bridge: !!(r && r.water > 30 && Math.abs(train.s - 20 - r.s) < r.half) };
}

// ===== 99-main.js =====
/* ═══ MAIN ═══ */
let built = false, train = null, lastT = 0, chunkT = 0, wiperPrev = { f: 0, b: 0 };
function buildAll() {
  if (built) return; built = true;
  buildRoute(); planShk(); trackMaterials(); worldMaterials(); structMaterials(); linesideMaterials(); stationMaterials(); shkMaterials();
  initWorld(); buildGround(); buildRivers(); buildTunnels(); buildChunks();
  buildStations(); buildSwitches(); buildSignals(); buildCrossings(); buildSigns(); buildPylons(); buildBackdrop();
  train = new Train205(W.scene); DRV.train = train;
  buildAmbient(); buildRacer(); buildMinimap(); buildShkStations(); buildZoomer(); planCaution();
  // fuse the static world into a few big meshes per chunk (iPad draw calls)
  chunks.forEach(c => mergeDeep(c.group)); EXTRAS.forEach(e => mergeDeep(e.group));
  setupCameraInput(); setupButtons();
  applyQuality(false);
}
function startGame(mode) {
  initA();
  G.mode = mode;
  $('loading').classList.add('show');
  // let the loading screen paint before the heavy build
  setTimeout(() => {
    buildAll();
    resetRun();
    if (mode === 'race') startRace(); else stopRace();
    $('scr-title').classList.add('gone'); $('scr-game').classList.remove('gone'); $('loading').classList.remove('show');
    onResize();
    G.running = true; lastT = performance.now(); requestAnimationFrame(loop);
    startTrainSound(); keepAwake(true);
    if (mode === 'regular') setTimeout(() => say('welcome', { cb: () => { if (DRV.atSt === 0 && DRV.doors === 'closed') { $('b-door').classList.add('hint'); bigMsg('Open the doors! 🚪<small>Let the passengers on</small>', 2400); } } }), 800);
  }, 60);
}
function resetRun() {
  train.s = STATIONS[0].stopS; train.v = 0; DRV.state = 'stopped'; DRV.nextIdx = 1; DRV.fast = true;
  Object.assign(DRV, { atSt: 0, doors: 'closed', doorK: 0, announced: {}, leftFrom: -1 }); train.setDoors(0);
  populateStations(); resetCallouts();
  setGoButton(); refreshNext(); setView('outside');
  $('b-lt').classList.toggle('on', train.lights.on); $('b-lc').className = 'cb ' + train.lights.color;
  $('b-fast').className = 'cb fast'; $('b-fast').innerHTML = '<i>🐇</i><b>Fast</b>'; $('b-lc-t').textContent = train.lights.color === 'red' ? 'Red' : 'White';
  train.place(); updateCamera(0, train);
}
function goHome() {
  setPaused(false);
  G.running = false; cancelVoice(); stopTrainSound(); hornOff(); stopRace(); keepAwake(false);
  $('scr-game').classList.add('gone'); $('scr-title').classList.remove('gone');
}
function tick(dt) {
  G.t += dt;
  updateDrive(dt);
  updateRace(dt);
  train.update(dt);
  for (const [k, key] of [['f', 'tf'], ['b', 'tb']]) {
    const ph = Math.floor(train.wiper[key] / Math.PI); if (ph !== wiperPrev[k]) { wiperPrev[k] = ph; if (train.wiper[key] > 0) sfx('wiper'); }
  }
  const cp = W.camera.position;
  updateAmbient(dt, train, cp);
  updatePeople(dt, cp);
  updateZoomer(dt, train, cp);
  updateCallouts(dt, train);
  updateSwitches(dt, train.s, cp);
  updateSignals(train.s, W.camera.position);
  updateCrossings(dt, AMB.active ? [{ s: train.s, dir: 1 }, { s: AMB.train.s, dir: -1 }] : [{ s: train.s, dir: 1 }], cp);
  updateCamera(dt, train); train.lod(W.camera.position, CAM.view);
  updateCabInstruments(dt, train);
  updateTunnelLight(dt, train);
  followSun(train.cars[1].position);
  W.backdrop.position.set(cp.x, 120, cp.z);
  for (const r of FEAT.rivers) if (r.waterMat) r.waterMat.map.offset.x += dt * .004;
  chunkT -= dt; if (chunkT <= 0) { chunkT = .3; updateChunks(); }
}
/* ── auto quality: watch the frame rate and step resolution / shadow detail ──
   tier 0 = lightest … 3 = sharpest. Remembered per device. */
const QUAL = { tiers: [
    { pr: 1.0, shadow: 1024, far: 1300, fog: 1150 },
    { pr: 1.25, shadow: 1024, far: 1550, fog: 1350 },
    { pr: 1.5, shadow: 2048, far: 1750, fog: 1500 },
    { pr: 1.75, shadow: 2048, far: 1750, fog: 1500 }],
  tier: 2, max: 3, acc: 0, n: 0, slow: 0, good: 0, hold: 0, tryUp: false };
try { const q = +localStorage.getItem('t205Q'); if (q >= 0 && q <= 3 && localStorage.getItem('t205Q') !== null) QUAL.tier = q; } catch (e) {}
function applyQuality(save = true) {
  const t = QUAL.tiers[QUAL.tier], r = W.renderer;
  r.setPixelRatio(Math.min(devicePixelRatio || 1, t.pr)); onResize();
  if (W.sun.shadow.mapSize.x !== t.shadow) { W.sun.shadow.mapSize.set(t.shadow, t.shadow); if (W.sun.shadow.map) { W.sun.shadow.map.dispose(); W.sun.shadow.map = null; } }
  W.scene.fog.far = t.fog; CHUNK_FAR = t.far;
  if (save) try { localStorage.setItem('t205Q', String(QUAL.tier)); } catch (e) {}
}
function watchQuality(rawDt) {
  if (document.hidden || rawDt > .25) return;          // ignore tab switches + hiccups
  QUAL.acc += rawDt; QUAL.n++;
  if (QUAL.acc < 2) return;
  const fps = QUAL.n / QUAL.acc; QUAL.acc = 0; QUAL.n = 0;
  if (QUAL.hold > 0) { QUAL.hold--; return; }          // let a change settle first
  if (fps < 44) QUAL.slow++; else QUAL.slow = 0;
  if (fps > 57) QUAL.good++; else QUAL.good = 0;
  if (QUAL.good >= 3) QUAL.tryUp = false;            // the last step up has proven itself
  // a step up that turned out too slow is not tried again this session
  if (QUAL.slow >= 2 && QUAL.tier > 0) { QUAL.tier--; if (QUAL.tryUp) QUAL.max = QUAL.tier; QUAL.tryUp = false; QUAL.slow = 0; QUAL.good = 0; QUAL.hold = 1; applyQuality(); }
  else if (QUAL.good >= 8 && QUAL.tier < QUAL.max) { QUAL.tier++; QUAL.good = 0; QUAL.hold = 1; QUAL.tryUp = true; applyQuality(); }
}
function loop(now) {
  if (!G.running) return;
  const raw = (now - lastT) / 1000;
  const dt = Math.min(.05, raw); lastT = now;
  if (G.paused) { W.renderer.render(W.scene, W.camera); requestAnimationFrame(loop); return; }
  watchQuality(raw);
  tick(dt);
  updateTrainSound(dt, train.v, DRV.state === 'go' && train.v < targetSpeed() - .3, DRV.state === 'braking', LOOK_VIEWS.includes(CAM.view), trainSoundEnv(train));
  drawSpeedo(train.v);
  if ((G.frame = (G.frame || 0) + 1) % 3 === 0) drawMinimap();
  W.renderer.render(W.scene, W.camera);
  requestAnimationFrame(loop);
}
tap($('m-reg'), () => startGame('regular'));
tap($('m-race'), () => startGame('race'));
tap($('res-again'), () => { resetRun(); startRace(); });
tap($('res-home'), goHome);
/* ── pause: freeze the world, hush every sound, big ▶ to carry on ── */
function setPaused(p) {
  if (!!G.paused === p) return;
  G.paused = p; $('paused').classList.toggle('show', p);
  if (p) { cancelVoice(); hornOff(); if (A) A.suspend().catch(() => {}); }
  else { if (A) A.resume().catch(() => {}); lastT = performance.now(); }
}
tap($('pause'), () => setPaused(true));
tap($('resume'), () => setPaused(false));
setMuted(muted);
/* ── iPad niceties ── */
// no pinch / double-tap zoom, no long-press menus, no rubber-band scrolling
for (const ev of ['gesturestart', 'gesturechange', 'gestureend', 'dblclick', 'contextmenu']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', e => { if (e.touches.length > 1 || !e.target.closest('#gl')) e.preventDefault(); }, { passive: false });
// keep the screen awake while driving
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && 'wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    if (!on && wakeLock) { wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}
// back from the Home Screen / sleep: wake the sound up and re-take the wake lock
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (A && A.state !== 'running' && !G.paused) A.resume().catch(() => {});
  if (G.running) { keepAwake(true); lastT = performance.now(); }
});
// grown-up tip when it is opened in Safari instead of from the Home Screen
const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches;
if (!standalone && /iPad|Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1) $('t-install').classList.remove('gone');
// debug hook for testing in the browser
window.__t205 = { G, DRV, TRACK, STATIONS, CAM, W: () => W, train: () => train, setView, startGame,
  FEAT, AMB, SWITCHES, SIGNALS, CROSSINGS, THREE, EXTRAS, PEOPLE, pressDoors, RC, RACE, startRace, SHK, ZOOM, shkOff, CO,
  step(sec) { for (let i = 0; i < sec * 30; i++) tick(1 / 30); updateChunks(); drawSpeedo(train.v + Math.random() * .01); W.renderer.render(W.scene, W.camera); } };
